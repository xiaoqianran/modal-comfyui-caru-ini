<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comfy Studio</title><link rel="stylesheet" href="/css/style.css"><script type="module" src="/js/app.js"></script></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">◈</span> Comfy Studio</div><small class="overline">WORKSPACE</small><nav><button class="nav active" data-page="overview">▦　总览</button><button class="nav" data-page="workflows">◇　工作流</button><button class="nav" data-page="assets">▧　资产库</button></nav><div class="sidebar-bottom"><span class="green-dot"></span> 本地控制台<br><small>Modal · R2 · Hugging Face</small></div></aside>
<div class="workspace"><header class="top"><div><small id="breadcrumb">Workspace / 总览</small><h1 id="page-title">总览</h1></div><button class="btn" id="refresh">↻ 刷新</button></header><div id="notice" hidden role="status"></div>
<main><section id="overview" class="page"><div class="stats"><div class="stat"><small>工作流总数</small><strong id="count-all">—</strong><span>本地配置</span></div><div class="stat"><small>已部署应用</small><strong id="count-deployed">—</strong><span>仅代表 Modal 部署状态</span></div><div class="stat"><small>其他状态</small><strong id="count-other">—</strong><span>未部署 / 已停止</span></div></div><div class="section-heading"><h2>工作流快捷入口</h2><button class="btn subtle" data-page="workflows">查看全部 →</button></div><div class="cards" id="featured"></div></section>
<section id="workflows" class="page" hidden><div class="section-heading"><div><h2>工作流</h2><p>部署管理与执行日志</p></div><span id="wf-count" class="pill"></span></div><div id="workflow-list" class="cards"></div><section id="detail" class="panel" hidden><div class="section-heading"><div><h2 id="detail-title"></h2><p id="detail-id"></p></div><span id="detail-status" class="status"></span></div><div class="metadata"><div><small>GPU</small><b id="detail-gpu"></b></div><div><small>Modal 应用</small><b id="detail-app"></b></div><div><small>健康检查</small><b>未检查</b></div></div><div class="actions"><button id="deploy" class="btn primary">部署 / 重新部署</button><button id="stop" class="btn">停止部署</button><button id="logs-btn" class="btn">读取应用日志</button><a id="app-link" class="btn" target="_blank" rel="noopener noreferrer" hidden>打开 ComfyUI ↗</a></div><div class="section-heading"><h2>运行日志</h2><small id="task-status">未执行任务</small></div><pre id="log-text">选择操作以查看日志。</pre></section></section>
<section id="assets" class="page" hidden><div class="section-heading"><div><h2>资产库</h2><p>Cloudflare R2 / Hugging Face S3</p></div><span id="asset-count" class="pill"></span></div><div class="filters"><label>来源<select id="source"><option value="r2">Cloudflare R2</option><option value="hf">Hugging Face S3</option></select></label><label>工作流<select id="asset-workflow"><option value="">全部工作流</option></select></label><label class="search">搜索<input id="search" placeholder="搜索文件名称"></label><button id="assets-refresh" class="btn">刷新资产</button></div><div class="asset-layout"><div id="file-list" class="files"></div><section class="panel asset-panel"><div class="section-heading"><h2 id="filename">选择一个资产</h2><a class="btn" id="download" hidden>下载 ↧</a></div><div id="viewer"><model-viewer id="model" camera-controls></model-viewer><div id="splat"></div><div id="hint">支持 GLB / GLTF 及部分 Gaussian Splat 格式</div></div></section></div></section></main></div></div></body></html>
