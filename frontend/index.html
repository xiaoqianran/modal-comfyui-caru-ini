<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comfy Studio</title>
<link rel="stylesheet" href="/css/style.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brandmark">◈</span><span class="brandname">Comfy Studio</span></div>
    <small class="overline">WORKSPACE</small>
    <nav aria-label="主导航">
      <button class="nav active" data-page="overview"><span class="ico">▦</span><span class="lbl">总览</span></button>
      <button class="nav" data-page="workflows"><span class="ico">◇</span><span class="lbl">工作流</span></button>
      <button class="nav" data-page="assets"><span class="ico">▧</span><span class="lbl">资产库</span></button>
    </nav>
    <div class="sidebar-bottom"><span class="green-dot"></span> 本地控制台<br><small>Modal · R2 · Hugging Face</small></div>
  </aside>

  <div class="workspace">
    <header class="top">
      <div><small id="breadcrumb">Workspace / 总览</small><h1 id="page-title">总览</h1></div>
      <button class="btn" id="refresh">↻ 刷新</button>
    </header>
    <div id="notice" hidden role="status" aria-live="polite"></div>

    <main>
      <section id="overview" class="page">
        <div class="stats">
          <div class="stat"><small>工作流总数</small><strong id="count-all">—</strong><span>本地配置</span></div>
          <div class="stat ok"><small>运行中</small><strong id="count-deployed">—</strong><span>Modal 已部署</span></div>
          <div class="stat"><small>未运行</small><strong id="count-other">—</strong><span>未部署 / 已停止</span></div>
        </div>
        <div class="section-heading"><h2>已部署的工作流</h2><button class="btn subtle" data-page="workflows">查看全部 →</button></div>
        <div class="cards" id="featured"></div>
      </section>

      <section id="workflows" class="page" hidden>
        <div class="section-heading">
          <div><h2>工作流</h2><p>部署管理、访问入口与执行日志</p></div>
          <span id="wf-count" class="pill"></span>
        </div>
        <div class="filters">
          <label class="search">搜索<input id="wf-search" type="search" placeholder="按名称或 GPU 过滤"></label>
          <label>状态<select id="wf-status"><option value="">全部</option><option value="deployed">已部署</option><option value="other">未运行</option></select></label>
        </div>
        <div id="workflow-list" class="cards"></div>

        <section id="detail" class="panel" hidden>
          <div class="section-heading">
            <div><h2 id="detail-title"></h2><p id="detail-id"></p></div>
            <span id="detail-status" class="badge"></span>
          </div>
          <div class="metadata">
            <div><small>GPU</small><b id="detail-gpu"></b></div>
            <div><small>Modal 应用</small><b id="detail-app"></b></div>
            <div><small>任务状态</small><b id="task-status">未执行任务</b></div>
          </div>
          <div class="urlbox">
            <small>ComfyUI 地址</small>
            <div class="urlrow">
              <code id="url-text"></code>
              <a id="app-link" class="btn primary" target="_blank" rel="noopener noreferrer">打开 ↗</a>
              <button id="copy-url" class="btn">复制</button>
            </div>
            <p id="url-hint"></p>
          </div>
          <div class="actions">
            <button id="deploy" class="btn primary">部署 / 重新部署</button>
            <button id="stop" class="btn danger">停止部署</button>
            <button id="logs-btn" class="btn">读取应用日志</button>
          </div>
          <div class="section-heading"><h2>运行日志</h2></div>
          <pre id="log-text">选择操作以查看日志。</pre>
        </section>
      </section>

      <section id="assets" class="page" hidden>
        <div class="section-heading"><div><h2>资产库</h2><p>Cloudflare R2 / Hugging Face S3</p></div><span id="asset-count" class="pill"></span></div>
        <div class="filters">
          <label>来源<select id="source"><option value="hf" selected>Hugging Face 永久归档</option><option value="r2">Cloudflare 预览</option></select></label>
          <label>工作流<select id="asset-workflow"><option value="">全部工作流</option></select></label>
          <label class="search">搜索<input id="search" placeholder="搜索文件名称"></label>
          <button id="assets-refresh" class="btn">刷新资产</button>
        </div>
        <div class="asset-layout">
          <div id="file-list" class="files"></div>
          <section class="panel asset-panel">
            <div class="section-heading"><h2 id="filename">选择一个资产</h2><a class="btn" id="download" hidden>下载 ↧</a></div>
            <div id="viewer"><img id="preview-img" alt="生成文件预览" hidden><model-viewer id="model" camera-controls></model-viewer><div id="splat"></div><div id="hint">支持 GLB / GLTF 及部分 Gaussian Splat 格式</div></div>
          </section>
        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
