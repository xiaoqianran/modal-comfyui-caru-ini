name: File Transfer MCP CI
on:
  push:
    paths:
      - integrations/file-transfer-mcp/**
      - .github/workflows/file-transfer-mcp-ci.yml
  pull_request:
    paths:
      - integrations/file-transfer-mcp/**
      - .github/workflows/file-transfer-mcp-ci.yml

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/file-transfer-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck and bundle
        run: npm run check
      - name: Bundle distributable Worker
        run: npx wrangler deploy --dry-run --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: file-transfer-worker
          path: integrations/file-transfer-mcp/dist/
          retention-days: 1
      - name: Verify PC2 receiver
        run: python3 -m unittest discover -s tests -v
