[project]
name = "modal-comfyui"
version = "0.1.0"
description = "Run ComfyUI on Modal with auto-scaling, GPU snapshots, and easy model management."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.114",
    "modal[api-proxy-support]>=1.6.4,<2",
    "modal-benchmark==0.2.2",
    "python-dotenv>=1.2.4",
]

[[tool.uv.index]]
name = "pypi-official"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
modal-benchmark = { index = "pypi-official" }
